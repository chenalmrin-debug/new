<!doctype html><html lang="he"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>
body{background:radial-gradient(circle at 80% 10%,#3a0d5c,#0b0613 60%)}
h1{position:absolute;top:210px;right:70px;font-size:130px}h1 span{color:var(--gold)}
.sub{position:absolute;top:470px;right:70px;font-size:48px;color:#cfc6e6;font-weight:500}
.cards{position:absolute;top:580px;right:70px;left:70px;display:flex;flex-direction:column;gap:34px}
.c{display:flex;align-items:center;justify-content:space-between;background:#ffffff12;border:2px solid #ffffff30;border-radius:44px;padding:38px 46px;backdrop-filter:blur(6px)}
.c.hot{border-color:var(--gold);background:linear-gradient(90deg,#ffc84a22,#ffffff10)}
.c h2{font-size:68px;font-weight:900}.c small{display:block;font-size:36px;font-weight:500;color:#cfc6e6;margin-top:8px;line-height:1.35}
.p{font-size:100px;font-weight:900;color:var(--cyan);direction:ltr;white-space:nowrap}.hot .p{color:var(--gold)}
.tag{display:inline-block;background:var(--gold);color:#000;font-size:30px;font-weight:800;padding:4px 18px;border-radius:30px;margin-right:16px;vertical-align:middle}
</style></head><body><div class="story">
<div class="brand">YOUR LOGO</div>
<h1>חבילות<br><span>מסיבה</span></h1><div class="sub">בוחרים חבילה — אנחנו מגיעים</div>
<div class="cards">
<div class="c"><div><h2>הבסיסית</h2><small>בקבוק וודקה · מיץ · קרח<br>כוסות וקשים</small></div><div class="p">₪199</div></div>
<div class="c hot"><div><h2>המסיבה<span class="tag">הכי נמכרת</span></h2><small>2 בקבוקים · XL · מיצים · קרח<br>פיצוחים + גומי</small></div><div class="p">₪399</div></div>
<div class="c"><div><h2>VIP</h2><small>בקבוקי פרימיום · XL · קרח<br>נשנושים · כוסות · קשים</small></div><div class="p">₪699</div></div>
</div>
<div class="cta">להזמנה — שלחו הודעה</div><div class="age">מחירים להמחשה בלבד · מיועד לבני 18 ומעלה</div>
</div></body></html>
